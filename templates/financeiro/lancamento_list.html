{% extends 'base.html' %}{% block title %}Lançamentos{% endblock %}{% block content %}
<div class="page-head"><div><p class="eyebrow">Movimentação</p><h1>Lançamentos</h1></div><div class="button-row"><a class="button" href="{% url 'importar-ofx' %}">Importar OFX</a><a class="button primary" href="{% url 'lancamento-create' %}">+ Novo lançamento</a></div></div>
<form class="filters"><input name="q" value="{{ filtros.q }}" placeholder="Descrição ou documento"><select name="tipo"><option value="">Todos os tipos</option>{% for valor,nome in tipos %}<option value="{{ valor }}">{{ nome }}</option>{% endfor %}</select><select name="conta"><option value="">Todas as contas</option>{% for item in contas %}<option value="{{ item.pk }}">{{ item }}</option>{% endfor %}</select><input type="date" name="inicio" value="{{ filtros.inicio }}"><input type="date" name="fim" value="{{ filtros.fim }}"><button class="button">Filtrar</button></form>
<div class="report-actions"><span>Prestação de contas:</span><a class="button small" href="{% url 'exportar-pdf' %}?{{ request.GET.urlencode }}">PDF</a><a class="button small" href="{% url 'exportar-excel' %}?{{ request.GET.urlencode }}">Excel</a></div><section class="panel">{% include 'financeiro/partials/tabela_lancamentos.html' %}</section>{% endblock %}
